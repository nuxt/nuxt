<!DOCTYPE html>
<html>
  <head>
    <title>{{ messages.loading }} | {{ messages.appName }}</title>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1.0,minimum-scale=1.0" name="viewport" />
    <script type="module" src="/templates/loading/shader/start.ts"></script>
    <style>
      :root {
        --nuxt-mint: #00dc82;
        --nuxt-mist: rgba(232, 255, 244, 0.88);
        --nuxt-dim: rgba(0, 220, 130, 0.55);
        /* the mint, deepened only where it has to carry small text on white */
        --nuxt-accent: #00dc82;
        /* official combined mark (viewBox 0 0 128 32): the icon is 48x32, the
           text runs 56-128, so gap = icon/6 and the caps are half its width */
        --nuxt-logo: min(15vw, 99px);
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: var(--nuxt-mist);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      svg { display: block; }
      #nuxt-shader {
        display: block;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        touch-action: none;
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      .nuxt-lockup {
        position: relative;
        z-index: 1;
        display: flex;
        /* the icon sits on the wordmark baseline, as in the official svg */
        align-items: flex-end;
        gap: calc(var(--nuxt-logo) / 6);
        text-decoration: none;
        color: inherit;
      }
      .nuxt-logo-slot {
        width: var(--nuxt-logo);
        height: calc(var(--nuxt-logo) * 32 / 48);
        flex: 0 0 var(--nuxt-logo);
        color: var(--nuxt-mint);
      }
      .nuxt-logo-slot > svg { width: 100%; height: 100%; }
      .nuxt-logo-slot > svg > path { fill: currentColor; }
      .nuxt-wordmark {
        width: calc(var(--nuxt-logo) * 1.5);
        height: calc(var(--nuxt-logo) * 0.5);
        color: #fff;
        transition: color 0.2s ease;
      }
      .nuxt-lockup:hover .nuxt-wordmark { color: var(--nuxt-mist); }
      .nuxt-corners {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1;
        display: flex;
        justify-content: space-between;
        padding: 22px 26px;
        pointer-events: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.12em;
        line-height: 1;
      }
      .nuxt-home {
        color: var(--nuxt-dim);
        text-decoration: none;
        pointer-events: auto;
        transition: color 0.2s ease;
      }
      .nuxt-home:hover { color: var(--nuxt-mist); }
      .nuxt-version { color: var(--nuxt-accent); }
      .nuxt-progress {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 1;
      }
      .nuxt-progress-status {
        margin: 0 0 14px;
        text-align: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.08em;
        line-height: 1;
        color: var(--nuxt-dim);
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .nuxt-progress[data-mode="determinate"] .nuxt-progress-status { opacity: 1; }
      .nuxt-progress-step { color: var(--nuxt-mist); }
      .nuxt-loader-bar {
        height: 2px;
        overflow: hidden;
        background: rgba(0, 220, 130, 0.16);
        /* @nuxt/cli still sizes this class as the old single-element bar */
        width: 100% !important;
      }
      .nuxt-loader-bar > span {
        display: block;
        height: 100%;
        width: 32%;
        background: var(--nuxt-mint);
        transform: translateX(-120%);
        animation: nuxt-bar 1.8s ease-in-out infinite;
      }
      /* a known step count turns the sweep into a real progress bar */
      .nuxt-progress[data-mode="determinate"] .nuxt-loader-bar > span {
        width: var(--nuxt-progress, 0%);
        transform: none;
        animation: none;
        transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }
      @keyframes nuxt-bar {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(360%); }
      }
      .nuxt-season {
        position: fixed;
        right: 22px;
        bottom: 26px;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        padding: 0;
        color: var(--nuxt-mint);
        background: rgba(0, 220, 130, 0.08);
        border: 1px solid rgba(0, 220, 130, 0.24);
        border-radius: 8px;
        cursor: pointer;
        transition: opacity 0.2s ease, background-color 0.2s ease;
      }
      /* an author `display` beats the UA rule for [hidden], so restate it */
      .nuxt-season[hidden] { display: none; }
      .nuxt-season:hover { background: rgba(0, 220, 130, 0.16); }
      .nuxt-season > svg { width: 16px; height: 16px; }
      .nuxt-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      @media (prefers-reduced-motion: reduce) {
        .nuxt-loader-bar > span {
          width: 100%;
          transform: none;
          animation: none;
        }
      }
      /* The shader draws the range as ink on paper in light mode. The mark keeps
         the brand green on both themes; only the text around it swaps to the
         brand ink, since #00dc82 is too light to read on white at 11px. */
      @media (prefers-color-scheme: light) {
        :root {
          --nuxt-mist: rgba(2, 4, 32, 0.76);
          --nuxt-dim: rgba(2, 4, 32, 0.42);
          --nuxt-accent: #00a86a;
        }
        html, body { background: #fff; }
        .nuxt-wordmark { color: #020420; }
        .nuxt-loader-bar { background: rgba(0, 220, 130, 0.22); }
      }
    </style>
  </head>
  <body>
    <canvas id="nuxt-shader" aria-hidden="true"></canvas>
    <a href="https://nuxt.com/?utm_source=nuxt-loading-screen" target="_blank" rel="noopener" class="nuxt-lockup" id="nuxtImg" aria-label="{{ messages.appName }}">
      <span id="nuxt-logo-slot" class="nuxt-logo-slot">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32" fill="none" aria-hidden="true">
          <path d="M26.88 32H44.64C45.2068 32.0001 45.7492 31.8009 46.24 31.52C46.7308 31.2391 47.2367 30.8865 47.52 30.4C47.8033 29.9135 48.0002 29.3615 48 28.7998C47.9998 28.2381 47.8037 27.6864 47.52 27.2001L35.52 6.56C35.2368 6.0736 34.8907 5.72084 34.4 5.44C33.9093 5.15916 33.2066 4.96 32.64 4.96C32.0734 4.96 31.5307 5.15916 31.04 5.44C30.5493 5.72084 30.2032 6.0736 29.92 6.56L26.88 11.84L20.8 1.59962C20.5165 1.11326 20.1708 0.600786 19.68 0.32C19.1892 0.0392139 18.6467 0 18.08 0C17.5133 0 16.9708 0.0392139 16.48 0.32C15.9892 0.600786 15.4835 1.11326 15.2 1.59962L0.32 27.2001C0.0363166 27.6864 0.000246899 28.2381 3.05588e-07 28.7998C-0.000246288 29.3615 0.0367437 29.9134 0.32 30.3999C0.603256 30.8864 1.10919 31.2391 1.6 31.52C2.09081 31.8009 2.63324 32.0001 3.2 32H14.4C18.8379 32 22.068 30.0092 24.32 26.24L29.76 16.8L32.64 11.84L41.44 26.88H29.76L26.88 32ZM14.24 26.88H6.4L18.08 6.72L24 16.8L20.0786 23.636C18.5831 26.0816 16.878 26.88 14.24 26.88Z" />
        </svg>
      </span>
      <svg class="nuxt-wordmark" xmlns="http://www.w3.org/2000/svg" viewBox="56 8 72 24" fill="none" aria-hidden="true">
        <path fill="currentColor" d="M60.32 32C60.6656 32 60.96 31.7135 60.96 31.36V16.48C60.96 16.48 61.76 17.92 63.2 20.32L69.44 31.04C69.7255 31.6384 70.359 32 70.88 32H75.2V8H70.88C70.5923 8 70.24 8.23906 70.24 8.64V23.68L67.36 18.56L61.6 8.8C61.3197 8.3026 60.7166 8 60.16 8H56V32H60.32Z" />

        <path fill="currentColor" d="M94.56 14.72V24.64C94.56 26.8806 93.7188 28.7695 92.48 30.08C91.2412 31.3905 89.5306 32 87.2 32C84.8694 32 82.9988 31.3905 81.76 30.08C80.5422 28.7695 79.68 26.8806 79.68 24.64V14.72H82.24C82.7859 14.72 83.3231 14.8195 83.68 15.2C84.0369 15.5593 84.16 15.7704 84.16 16.32V24.64C84.16 25.9294 84.2331 26.7259 84.8 27.36C85.3669 27.973 86.0662 28.16 87.2 28.16C88.3548 28.16 88.8731 27.973 89.44 27.36C90.0069 26.7259 90.08 25.9294 90.08 24.64V16.32C90.08 15.7704 90.2031 15.4205 90.56 15.04C90.8736 14.7057 91.2045 14.7136 91.68 14.72C91.7457 14.7209 91.9337 14.72 92 14.72H94.56Z" />

      </svg>
    </a>
    <div class="nuxt-corners">
      <a class="nuxt-home" href="https://nuxt.com/?utm_source=nuxt-loading-screen" target="_blank" rel="noopener">nuxt.com</a>
      <span class="nuxt-version">{{ version }}</span>
    </div>
    <!-- Revealed by JS only when winter is in season. It ships in the markup so
         the build's critical-CSS pass keeps its styles. -->
    <button class="nuxt-season" id="nuxt-season" type="button" hidden aria-pressed="true" title="Turn off snow">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 1.6v12.8M2.46 4.8l11.08 6.4M2.46 11.2l11.08-6.4" />
        <path d="M6.1 3.1 8 4.2l1.9-1.1M6.1 12.9 8 11.8l1.9 1.1" />
      </svg>
      <span class="nuxt-sr">Snow</span>
    </button>
    <div class="nuxt-progress" id="nuxt-progress">
      <p class="nuxt-progress-status" id="nuxt-progress-status" aria-live="polite"></p>
      <div class="nuxt-loader-bar"><span id="nuxt-progress-fill"></span></div>
    </div>
    <script>
      if (typeof window.fetch === 'undefined') {
        setTimeout(() => window.location.reload(), 200)
      } else {
        // Backs off so a slow build is not polled five times a second for its whole duration.
        let delay = 200
        const check = async () => {
          try {
            const body = await window
              .fetch(window.location.href, { headers: { accept: 'text/html' } })
              .then(r => r.text())
            if (!body.includes('__NUXT_LOADING__')) {
              return window
                .location
                .reload()
            }
          } catch {}
          setTimeout(check, delay)
          delay = Math.min(Math.round(delay * 1.5), 1000)
        }
        check()
      }
    </script>
  </body>
</html>
