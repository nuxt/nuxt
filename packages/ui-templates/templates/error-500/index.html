<!DOCTYPE html>
<html>

<head>

  <meta charset="utf-8" />
  <meta content="width=device-width,initial-scale=1.0,minimum-scale=1.0" name="viewport" />
  <script type="module" src="/styles.ts"></script>
</head>

<body
  class="font-sans antialiased bg-white dark:bg-neutral-950 text-neutral-950 tracking-wide dark:text-white grid min-h-screen place-content-center overflow-hidden ">
  <div class="max-w-520px text-center">
    <h1 class="text-[56px] sm:text-[72px] font-medium mb-4 tabular-nums leading-none">{{ messages.status }}</h1>

</html>
