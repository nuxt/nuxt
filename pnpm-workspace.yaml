packages:
  - docs
  - packages/**
  - '!packages/nuxi'
  - '!packages/test-utils'
  - '!packages/nuxt/test/package-fixture/pkg'
  - playground
  - test/fixtures/*
  - test/fixtures/*/_local-modules/*

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  oxc-resolver: false
  unrs-resolver: false

patchedDependencies:
  # `types.d.ts` re-exports an extensionless path, which `nodenext` cannot resolve
  nitropack@2.13.4: patches/nitropack@2.13.4.patch

publicHoistPattern:
  - '*-loader'
  - 'webpack-*'
  - 'estree-walker'

shellEmulator: true

verifyDepsBeforeRun: install

ignoreWorkspaceCycles: true

overrides:
  "@nuxt/kit": "workspace:*"
  "@nuxt/schema": "workspace:*"
  esbuild: "0.28.2"
  nuxt: "workspace:*"
  oxc-parser: "0.147.0"
  vite: "8.2.2"
  vue: "3.5.42"

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@nuxt/*'
  - fnv1a-64
  - vue-bundle-renderer
  - unrouting
  - unimport
  - oxc-walker@1.1.1
  - impound@1.2.0
  - vue
  - '@vue/*'
  - '@flakiness/vitest@1.9.2'

