packages:
  - docs
  - packages/**
  - '!packages/nuxi'
  - '!packages/test-utils'
  - '!packages/nuxt/test/package-fixture/pkg'
  - playground
  - test/fixtures/*
  - test/fixtures/*/_local-modules/*

patchedDependencies:
  changelogen: patches/changelogen.patch
  nitro@3.0.260610-beta: patches/nitro@3.0.260610-beta.patch
  # `types.d.ts` re-exports an extensionless path, which `nodenext` cannot resolve
  nitropack@2.13.4: patches/nitropack@2.13.4.patch

publicHoistPattern:
  - '*-loader'
  - 'webpack-*'

shellEmulator: true

verifyDepsBeforeRun: install

ignoreWorkspaceCycles: true

overrides:
  "@nuxt/kit": "workspace:*"
  "@nuxt/schema": "workspace:*"
  "@types/node": "24.13.3"
  nuxt: "workspace:*"
  oxc-parser: "0.144.0"
  rolldown: "1.2.4"
  vite: "8.2.1"
  vue: "3.5.41"

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: false

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@nuxt/*'
  - fnv1a-64
  # Renovate security update: esbuild@0.28.1
  - esbuild@0.28.1
  - vue-bundle-renderer
  - unrouting
  - unimport
  # Renovate security update: undici@8.5.0
  - undici@8.5.0
  - unctx@3.0.0-beta.2
  - magic-string@1.0.0
  - verkit@0.1.2
  - '@unhead/bundler@3.2.1'
  - '@unhead/vue@3.2.1'
  - unhead@3.2.1
  - impound@1.1.6
  - oxc-walker@1.1.1
  - vue
  - '@vue/*'

catalogs:
  # imported in the nuxt app runtime (packages/nuxt/src/app, head/runtime, pages/runtime)
  app-runtime:
    '@unhead/vue': ^3.3.2
    '@vue/shared': ^3.5.41
    consola: ^3.4.2
    cookie-es: ^3.1.1
    defu: ^6.1.7
    devalue: ^5.9.0
    errx: ^0.1.2
    fnv1a-64: ^0.1.2
    hookable: ^6.1.1
    klona: ^2.0.6
    nostics: ^1.2.0
    object-identity: ^0.2.3
    ofetch: 2.0.0-alpha.3 # intentionally pinned to match nitro's dependency
    ohash: ^2.0.12
    pathe: ^2.0.3
    perfect-debounce: ^2.1.0
    ufo: ^1.6.4
    uncrypto: ^0.1.3
    unctx: ^3.0.0
    unhead: ^3.3.2
    vue: ^3.5.41
    vue-bundle-renderer: ^2.3.2
    vue-router: ^5.2.0

  # imported in the server runtime (packages/nuxt/src/runtime/server, packages/nitro-server/src/runtime)
  nitro-runtime:
    destr: ^2.0.5
    lru-cache: ^11.5.2
    nitro: ^3.0.260610-beta
    srvx: 0.11.22 # intentionally pinned to match nitro's dependency
    unstorage: 2.0.0-alpha.7 # intentionally pinned to match nitro's dependency

  # vue compiler/tooling
  vue:
    '@vitejs/plugin-vue': ^6.0.8
    # kept in lockstep with the vue override above
    '@vue/compiler-sfc': 3.5.41
    rspack-vue-loader: ^17.6.2
    vue-component-type-helpers: ^3.3.10
    vue-devtools-stub: ^0.1.0
    vue-loader: ^17.4.2

  # vite/rolldown/oxc toolchain
  vite:
    magic-string: ^1.2.0
    oxc-walker: ^1.1.1
    # needs to match vite's own `~1.1.5` pin
    rolldown: ~1.2.4
    rolldown-string: ^0.3.1
    # resolution is pinned via the vite override above
    vite: ^8.2.1
    vite-node: ^6.0.0
    vite-plugin-checker: ^0.14.5

  # webpack/rspack pipeline
  webpack:
    '@nuxt/friendly-errors-webpack-plugin': ^2.6.0
    '@rsbuild/core': ~2.1.13
    css-loader: ^7.1.4
    css-minimizer-webpack-plugin: ^8.0.0
    esbuild-loader: ^4.5.0
    file-loader: ^6.2.0
    fork-ts-checker-webpack-plugin: ^9.1.0
    hash-sum: ^2.0.0
    memfs: ^4.68.1
    mini-css-extract-plugin: ^2.10.2
    pug-plain-loader: ^1.1.0
    raw-loader: ^4.0.2
    time-fix-plugin: ^2.0.7
    ts-checker-rspack-plugin: ^1.6.1
    url-loader: ^4.1.1
    webpack: ^5.109.2
    webpack-bundle-analyzer: ^5.3.1
    webpack-dev-middleware: ^8.1.1
    webpack-hot-middleware: ^2.26.1
    webpackbar: ^7.0.0

  # build-time deps of published packages
  build:
    '@ampproject/remapping': ^2.3.0
    '@dxup/nuxt': ^0.5.8
    '@nuxt/cli': npm:@nuxt/cli-nightly@^4.0.0-20260817-085717-0bb4e52
