name: chore

on:
  # zizmor: ignore[dangerous-triggers] needs write access to set status check on PRs from forks; no PR code is checked out (only metadata is read)
  # DO NOT add action/checkout in this workflow
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions: {}

jobs:
  semantic-pr:
    permissions:
      contents: read
      pull-requests: read  # for amannn/action-semantic-pull-request to analyze PRs
      statuses: write  # for amannn/action-semantic-pull-request to mark status of analyzed PR
    if: github.repository == 'nuxt/nuxt' && !startsWith(github.head_ref, 'v') && !startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-slim
    name: semantic-pr
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        with:
          scopes: |
            docs
            kit
            nuxt
            rspack
            schema
            ui-templates
            vite
            vite-server
            webpack
            nitro
            deps
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
