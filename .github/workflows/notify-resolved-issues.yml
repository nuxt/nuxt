name: notify resolved issues

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      dry-run:
        default: false
        type: boolean
      notify-once:
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to notify for (e.g. v4.2.0)
        required: true
        type: string
      dry-run:
        description: log the issues that would be commented on, without commenting
        default: true
        type: boolean
      notify-once:
        description: skip issues already notified for an earlier release (e.g. a backport)
        default: true
        type: boolean

permissions: {}

concurrency:
  group: notify-resolved-issues-${{ inputs.tag }}

jobs:
  notify:
    if: github.repository_owner == 'nuxt'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: latest
          cache: true

      - run: node ./scripts/notify-resolved-issues.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry-run }}
          NOTIFY_ONCE: ${{ inputs.notify-once }}
